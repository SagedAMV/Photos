name: Build Mini APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mini:
    runs-on: ubuntu-latest
    steps:
      - name: Clone app source (app_ma)
        run: git clone --depth 1 https://github.com/SagedAMV/app_ma.git src

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android SDK 35
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort | tail -1)"
          if [ -n "$SDKM" ]; then yes | "$SDKM" --licenses >/dev/null 2>&1 || true; fi
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ]; then "$SDKM" "platforms;android-35"; fi
          if [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then "$SDKM" "build-tools;35.0.0"; fi

      - name: Configure a single minified mini build (CI workspace only)
        working-directory: src
        run: |
          python3 - <<'PY'
          p = 'app/build.gradle.kts'
          s = open(p, encoding='utf-8').read()
          bt = (
              "        debug {\n"
              "            isMinifyEnabled = true\n"
              "            isShrinkResources = true\n"
              "            proguardFiles(getDefaultProguardFile(\"proguard-android-optimize.txt\"), \"proguard-rules.pro\")\n"
              "        }\n"
          )
          s = s.replace("    buildTypes {\n", "    buildTypes {\n" + bt, 1)
          open(p, 'w', encoding='utf-8').write(s)
          open('app/proguard-rules.pro', 'a', encoding='utf-8').write(
              "\n-keep class org.json.** { *; }\n"
              "-keep class com.mahfazty.smart.data.db.** { *; }\n"
              "-keep class com.mahfazty.smart.domain.model.** { *; }\n"
              "-dontwarn kotlinx.coroutines.**\n"
          )
          PY

      - name: Build ONLY the mini APK
        working-directory: src
        shell: bash
        run: |
          set -eo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace -x lint 2>&1 | tee build.log

      - name: Collect APK
        run: |
          mkdir -p out
          cp src/app/build/outputs/apk/debug/app-debug.apk out/mahfazty-mini.apk
          ls -lh out

      - name: Upload APK as artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: mahfazty-mini-apk
          path: out/mahfazty-mini.apk

      - name: Upload mini APK to Photos via Git Data API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os, json, base64, urllib.request, urllib.error
          tok=os.environ['GH_TOKEN']; repo=os.environ['REPO']
          api=f'https://api.github.com/repos/{repo}'
          H={'Authorization':'Bearer '+tok,'Accept':'application/vnd.github+json','User-Agent':'ci','Content-Type':'application/json'}
          def call(method,path,body=None):
              req=urllib.request.Request(api+path,method=method,data=json.dumps(body).encode() if body else None,headers=H)
              with urllib.request.urlopen(req,timeout=120) as r: return json.loads(r.read().decode())
          data=open('out/mahfazty-mini.apk','rb').read()
          print('APK bytes:', len(data))
          blob=call('POST','/git/blobs',{'content':base64.b64encode(data).decode(),'encoding':'base64'})
          parent=call('GET','/git/ref/heads/main')['object']['sha']
          base=call('GET',f'/git/commits/{parent}')
          tree=call('POST','/git/trees',{'base_tree':base['tree']['sha'],'tree':[{'path':'محفظتي-الذكية-مصغرة.apk','mode':'100644','type':'blob','sha':blob['sha']}]})
          new=call('POST','/git/commits',{'message':'بناء نسخة مصغرة (minified) من app_ma عبر CI','tree':tree['sha'],'parents':[parent]})
          call('PATCH','/git/refs/heads/main',{'sha':new['sha']})
          print('UPLOADED commit', new['sha'])
          PY
